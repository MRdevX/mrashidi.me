packages:
  - "apps/*"
  - "packages/*"

catalog:
  ai: ^7.0.159
  typescript: 7.0.2
  vitest: ^5.0.5
  zod: ^4.6.7
overrides:
  serialize-javascript: ">=7.1.3"
  "glob@13": "^14.0.2"
  "minimatch@10": "^11.0.1"
  fast-uri: ">=3.1.2"
  "@babel/plugin-transform-modules-systemjs": ">=7.29.4"
  postcss: ">=8.5.10"
  # @vercel/og 0.11 auto-installs sharp 0.34 (libvips/libheif CVEs); 1.0.x ships without hb.wasm.
  sharp: ">=0.35.4"
  # GHSA-wx4j-mvgx-mqwp: @vercel/og 0.11 pins a satori with improper SVG escaping.
  satori: ">=0.33.5"
  "satori>fflate": "^0.7.5"
  zod: ">=4.6.6"
  undici@7: "^7.30.1"
  "@esbuild-kit/core-utils>esbuild": "^0.28.2"

# Optimize dependency resolution for faster installs
resolutionMode: "lowest-direct"

# Enable optimistic repeat installs for faster development
optimisticRepeatInstall: true

# Enable shell emulator for cross-platform compatibility
shellEmulator: true

# Optimize hoisting for better performance and tool compatibility
hoist: true
hoistPattern:
  - "*typescript*"
  - "*biome*"
  # Libraries such as react-icons import React types they do not declare; they must resolve @types/react.
  - "@types/*"
  # drizzle-kit imports drizzle-orm at runtime without declaring it as a dependency.
  - "drizzle-orm"

# Only build dependencies that need native compilation
onlyBuiltDependencies:
  - "@sentry/cli"
  - "@tailwindcss/oxide"
  - "@vercel/speed-insights"
  - canvas
  - esbuild
  - sharp
  - workerd

# Flexible peer dependency handling for development
strictPeerDependencies: false
autoInstallPeers: true
allowBuilds:
  '@sentry/cli': true
  # Its postinstall only checks the native binary loads and falls back to @swc/wasm.
  '@swc/core': false
  # Its postinstall only prints a funding banner.
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS on deeply nested patterns; no patched
    # release exists. Only reached via build-time globbing (fast-glob)
    # with repo-controlled patterns. Remove once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261026.1'
  - miniflare@5.20261023.0-beta
  - wrangler@4.153.0
