# OSSF Scorecard — measures security posture and publishes results to the
# GitHub Security tab (Code scanning alerts) and the public Scorecard API.
# https://securityscorecards.dev

name: OSSF Scorecard

run-name: OSSF Scorecard — ${{ github.ref_name }}

on:
  schedule:
    # Weekly on Monday at 01:23 UTC — offset from midnight to reduce load spikes.
    - cron: "23 1 * * 1"
  workflow_dispatch:

# No cancel-in-progress: a manual run must never interrupt the scheduled one.
concurrency:
  group: scorecard-${{ github.ref }}

permissions: read-all

jobs:
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required for private repos; harmless on public.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to https://securityscorecards.dev (public repos only).
          publish_results: true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif
          wait-for-processing: true
