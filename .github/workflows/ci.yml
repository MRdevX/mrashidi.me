# Lint, unit tests and Next.js build (CI skips assets + PWA; see job summary).
# Playwright E2E is local-only (`pnpm test:e2e`).
#
# Smart triggering:
#   push:main / workflow_dispatch  → all jobs always run (safety net before auto-release).
#   pull_request                   → "changes" detects which buckets are affected;
#                                    only impacted jobs run. "CI result" always runs and
#                                    is the single required status check (skipped = ok).

name: CI

run-name: CI — ${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".versionrc.json"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Job graph:
#
#   changes ──┬──► quality ──┐
#             └──► build   ──┴──► CI result
# ---------------------------------------------------------------------------

jobs:
  # ── 1. Detect which buckets are affected ──────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # On push/dispatch: always true. On PRs: true only when relevant paths changed.
      quality: ${{ github.event_name != 'pull_request' || steps.filter.outputs.quality == 'true' }}
      build:   ${{ github.event_name != 'pull_request' || steps.filter.outputs.build   == 'true' }}
    steps:
      # paths-filter uses the GitHub API for pull_request events — no checkout needed.
      - name: Path filter (PRs only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            quality:
              - 'src/**'
              - 'tests/unit/**'
              - 'tests/setup.ts'
              - 'tests/utils/**'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'vitest.config.mts'
              - 'sentry-shared.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            build:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.mjs'
              - 'tsconfig.json'
              - 'postcss.config.js'
              - 'tailwind.config.ts'
              - 'sentry.edge.config.ts'
              - 'sentry.server.config.ts'
              - 'sentry-shared.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # ── 2. Lint · Typecheck · Unit tests ──────────────────────────────────────
  quality:
    name: Lint · Typecheck · Unit tests
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Commitlint (PRs only)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Lint (Biome)
        run: pnpm exec biome check . --reporter=github

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm exec vitest run --reporter=verbose --reporter=github-actions

      - name: Job summary — quality
        if: success()
        run: |
          {
            echo "## Quality passed"
            echo ""
            echo "- Lint: Biome (\`pnpm check\`)"
            echo "- Types: TypeScript (\`pnpm typecheck\`)"
            echo "- Unit tests: Vitest (\`pnpm test:run\`)"
            echo ""
            echo "_PR pushes also run Commitlint against the commit range above._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        name: Upload unit test artifacts (on failure)
        if: failure()
        with:
          name: unit-test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ── 3. Next.js build (parallel with quality) ──────────────────────────────
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Restore Next.js cache
        uses: actions/cache@v6
        id: next-cache
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Next.js build (CI profile)
        run: pnpm build:ci

      - name: Job summary — build
        if: success()
        run: |
          {
            echo "## Build passed"
            echo ""
            echo "- Command: \`pnpm build:ci\` (= \`build:fast\`: no asset pregeneration, **PWA off**)."
            echo "- Production deploy should use \`pnpm build\` (assets + **PWA**)."
            CACHE_HIT="${{ steps.next-cache.outputs.cache-hit }}"
            if [ "$CACHE_HIT" = 'true' ]; then
              echo "- Next cache: **hit** (restored \`.next/cache\`)."
            else
              echo "- Next cache: **miss** (\`pnpm-lock.yaml\` key or first run — cold compile)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Required status check: aggregates every job above ──────────────────
  ci-result:
    name: CI result
    needs: [changes, quality, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "changes=${{ needs.changes.result }} quality=${{ needs.quality.result }} build=${{ needs.build.result }}"
          if [ "$FAILED" = "true" ]; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
