# Terraform for the Cloudflare zone, D1, the API custom domain and the Vercel project (infra/).
# Every run lints all roots and plans global and production into the job summary; PRs also get the
# plan as a comment. A push to main applies both behind the deploy-gate environment's approval
# (DR-0008), after the ungated plan jobs, so the approver reads the plan before approving. A weekly
# run fails when main has drifted from the live resources. live/github is applied only from a
# workstation: it writes the secrets this workflow runs with.

name: Infra

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/actions/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/actions/terraform/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The R2 backend locks state, but two runs racing turn into a confusing lock error. Never cancel:
# killing an apply mid-write tears state.
concurrency:
  group: infra-${{ github.ref }}

env:
  # Terraform's S3 backend reads AWS_* names; the values are Cloudflare R2 S3 credentials.
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
  TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
  TF_VAR_vercel_api_token: ${{ secrets.TF_VERCEL_API_TOKEN }}
  TF_VAR_content_api_token: ${{ secrets.CONTENT_API_TOKEN }}
  TF_VAR_content_api_read_token: ${{ secrets.CONTENT_API_READ_TOKEN }}
  TF_VAR_revalidate_secret: ${{ secrets.REVALIDATE_SECRET }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Format check
        run: terraform -chdir=infra fmt -recursive -check -diff

      - name: Validate
        run: |
          for root in bootstrap live/global live/production live/github; do
            terraform -chdir="infra/$root" init -backend=false -lockfile=readonly -input=false >/dev/null
            terraform -chdir="infra/$root" validate -no-color
          done

      # --recursive reads --config relative to each module, so pass it absolute.
      - name: TFLint
        working-directory: infra
        run: tflint --recursive --config "$PWD/.tflint.hcl"

  # Fork and Dependabot PRs get no Actions secrets; Lint still covers them and main plans after merge.
  plan:
    name: Plan (${{ matrix.root }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: [global, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform

      - name: Init
        run: terraform -chdir=infra/live/${{ matrix.root }} init -lockfile=readonly -backend-config=../../backend.r2.hcl

      # No -out: a saved plan embeds secret values and must never become an artifact.
      - name: Plan
        id: plan
        env:
          ROOT: ${{ matrix.root }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e -o pipefail
          terraform -chdir="infra/live/$ROOT" plan -no-color -lock-timeout=5m -detailed-exitcode 2>&1 | tee plan.txt
          code=$?
          set -e
          summary=$(grep -E '^(Plan:|No changes)' plan.txt | head -1)
          {
            echo 'summary<<PLANEOF'
            echo "$summary"
            echo PLANEOF
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan — \`$ROOT\`"
            echo
            echo "**${summary:-see log}**"
            echo
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ] && [ "$EVENT" = schedule ]; then
            echo "::error::$ROOT has drifted from main: $summary"
            exit 1
          fi

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ matrix.root }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require("node:fs");
            const root = process.env.ROOT;
            const marker = `<!-- infra-plan:${root} -->`;
            let plan = fs.readFileSync("plan.txt", "utf8");
            if (plan.length > 55000) plan = `${plan.slice(0, 55000)}\n… truncated, see the job log.`;
            const body = [
              marker,
              `### Terraform plan — \`${root}\``,
              "",
              `**${(process.env.SUMMARY || "").trim() || "see log"}**`,
              "",
              "<details><summary>Full plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "",
              "</details>",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply (${{ matrix.root }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: deploy-gate
    strategy:
      max-parallel: 1
      matrix:
        root: [global, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform

      - name: Init
        run: terraform -chdir=infra/live/${{ matrix.root }} init -lockfile=readonly -backend-config=../../backend.r2.hcl

      - name: Apply
        run: terraform -chdir=infra/live/${{ matrix.root }} apply -auto-approve -no-color -lock-timeout=5m
