# Terraform for the Cloudflare zone, D1, the API custom domain and the Vercel project (infra/).
# PRs plan global and production and comment the plan; a push to main applies both behind the
# production environment's approval (DR-0008). live/github is applied only from a workstation:
# it writes the secrets this workflow runs with.

name: Infra

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/actions/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/actions/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

# The R2 backend locks state, but two runs racing turn into a confusing lock error. Never cancel:
# killing an apply mid-write tears state.
concurrency:
  group: infra-${{ github.ref }}

env:
  # Terraform's S3 backend reads AWS_* names; the values are Cloudflare R2 S3 credentials.
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
  TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
  TF_VAR_vercel_api_token: ${{ secrets.TF_VERCEL_API_TOKEN }}
  TF_VAR_content_api_token: ${{ secrets.CONTENT_API_TOKEN }}
  TF_VAR_revalidate_secret: ${{ secrets.REVALIDATE_SECRET }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ matrix.root }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: [global, production]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform
        with:
          root: ${{ matrix.root }}

      - name: Format check
        run: terraform -chdir=infra fmt -recursive -check -diff

      - name: Validate
        run: terraform -chdir=infra/live/${{ matrix.root }} validate

      # No -out: a saved plan embeds secret values and must never become an artifact.
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=infra/live/${{ matrix.root }} plan -no-color 2>&1 | tee plan.txt
          {
            echo 'summary<<PLANEOF'
            grep -E '^(Plan:|No changes)' plan.txt | head -1
            echo PLANEOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          ROOT: ${{ matrix.root }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require("node:fs");
            const root = process.env.ROOT;
            const marker = `<!-- infra-plan:${root} -->`;
            let plan = fs.readFileSync("plan.txt", "utf8");
            if (plan.length > 55000) plan = `${plan.slice(0, 55000)}\n… truncated, see the job log.`;
            const body = [
              marker,
              `### Terraform plan — \`${root}\``,
              "",
              `**${(process.env.SUMMARY || "").trim() || "see log"}**`,
              "",
              "<details><summary>Full plan</summary>",
              "",
              "```terraform",
              plan,
              "```",
              "",
              "</details>",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply (${{ matrix.root }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        root: [global, production]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform
        with:
          root: ${{ matrix.root }}

      - name: Apply
        run: terraform -chdir=infra/live/${{ matrix.root }} apply -auto-approve -no-color
