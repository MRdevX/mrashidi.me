name: Terraform setup
description: Terraform pinned by infra/.terraform-version, without the wrapper so exit codes and stdout pass through.

runs:
  using: composite
  steps:
    - name: Read Terraform version
      id: tfver
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < infra/.terraform-version)" >> "$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.tfver.outputs.version }}
        terraform_wrapper: false
