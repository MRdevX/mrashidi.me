name: Setup Node.js
description: Install pnpm (from packageManager), Node from .node-version, cache pnpm store, frozen install.

runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Node.js (version from repo)
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: ".node-version"
        cache: pnpm

    - name: Respect engines in package.json
      run: pnpm config set engine-strict true
      shell: bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
