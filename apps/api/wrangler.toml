name = "mrashidi-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

[dev]
port = 8787

# database_id comes from the Terraform output of infra/live/production (d1_database_id).
[[d1_databases]]
binding = "DB"
database_name = "mrashidi-db"
database_id = "fdf97f4f-fe5c-491c-95b7-3ba3337415b6"
migrations_dir = "migrations"

[observability]
enabled = true
