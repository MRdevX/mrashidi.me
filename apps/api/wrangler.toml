name = "mrashidi-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
upload_source_maps = true

[dev]
port = 8787

[vars]
ALLOWED_ORIGINS = "https://mrashidi.me,https://www.mrashidi.me"

# database_id comes from the Terraform output of infra/live/production (d1_database_id).
[[d1_databases]]
binding = "DB"
database_name = "mrashidi-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
